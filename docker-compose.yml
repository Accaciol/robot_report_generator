services:
  robot-report-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-report-generator
    ports:
      - "5000:5000"
    environment:
      - ROBOT_REPORT_HOST=0.0.0.0
      - ROBOT_REPORT_PORT=5000
      - ROBOT_REPORT_ORIGIN=http://127.0.0.1:5000
      - ROBOT_REPORT_NO_BROWSER=1
      - ROBOT_REPORT_DATABASE=/app/data/report_history.sqlite3
    volumes:
      - robot-report-data:/app/data
      - ./example:/app/example
    restart: unless-stopped

volumes:
  robot-report-data:
