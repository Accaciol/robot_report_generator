<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/public_catalog.css">
  <script src="/static/public_catalog.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/public"><span class="brand-mark" aria-hidden="true">R</span>Robot Reports</a>
    <div class="system-control">
      <label for="system-select">VISUALIZAR SISTEMA</label>
      <select id="system-select" disabled><option value="">Carregando sistemas…</option></select>
    </div>
    <button id="refresh-page" type="button" aria-label="Atualizar dados">↻ <span>Atualizar</span></button>
  </header>
  <main>
    <section id="overview" aria-live="polite">
      <p class="eyebrow">RELATÓRIOS COMPARTILHADOS</p>
      <h1>Resultados das execuções</h1>
      <p id="status">Carregando os sistemas…</p>
      <div id="summary" class="summary" hidden></div>
      <div class="overview-chart-controls"><label for="overview-period">Período do gráfico <select id="overview-period"><option value="all">Todo o histórico</option><option value="365">365 dias</option><option value="90">90 dias</option><option value="30">30 dias</option></select></label></div>
      <section id="systems-trend-panel" class="dashboard-panel systems-trend-panel" hidden>
        <div class="panel-heading"><div><h2>Tendência histórica por sistema</h2><p>Uma linha para cada sistema, no período selecionado</p></div></div>
        <svg id="systems-trend-chart" viewBox="0 0 720 230" role="img" aria-label="Taxa de aprovação histórica de cada sistema"></svg>
        <div id="systems-trend-labels" class="trend-labels"></div>
        <div id="systems-trend-legend" class="systems-trend-legend"></div>
      </section>
      <ul id="systems" class="systems"></ul>
    </section>
    <section id="report-section" class="report-section" hidden>
      <p id="report-status" role="status" hidden></p>
      <iframe id="report" title="Relatório detalhado do sistema" sandbox="allow-scripts allow-downloads allow-popups"></iframe>
    </section>
  </main>
</body>
</html>
