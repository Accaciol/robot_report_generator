# Azure DevOps Services: cadastrar esta pipeline após o primeiro envio de resultados.
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - robot-results/systems/**
      - azure-pipelines.yml

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: Selecionar Python

  - bash: |
      set -euo pipefail
      if [ ! -d robot-results/systems ]; then
        echo '##vso[task.logissue type=error]Catálogo robot-results/systems não encontrado.'
        exit 1
      fi
      python -m pip install -r requirements.txt
    displayName: Validar entrada e instalar dependências

  - bash: |
      set -euo pipefail
      python main.py \
        --catalog-dir robot-results/systems \
        --report "$(Build.ArtifactStagingDirectory)/relatorio.html"
    displayName: Gerar relatório consolidado dos sistemas

  - publish: $(Build.ArtifactStagingDirectory)/relatorio.html
    artifact: robot-report
    displayName: Publicar relatório HTML
