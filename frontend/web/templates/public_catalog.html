<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/public_catalog.css">
  <script src="/static/public_catalog.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="/public"><span class="brand-mark" aria-hidden="true">R</span>Robot Reports</a>
    <div class="system-control">
      <label for="system-select">VISUALIZAR SISTEMA</label>
      <select id="system-select" disabled><option value="">Carregando sistemas…</option></select>
    </div>
    <button id="open-pdf-modal" type="button" class="btn-pdf-export" aria-label="Exportar PDF customizado">📄 <span>Exportar PDF</span></button>
    <button id="refresh-page" type="button" aria-label="Atualizar dados">↻ <span>Atualizar</span></button>
  </header>
  <main>
    <section id="overview" aria-live="polite">
      <p class="eyebrow">RELATÓRIOS COMPARTILHADOS</p>
      <h1>Resultados das execuções</h1>
      <p id="status">Carregando os sistemas…</p>
      <div id="summary" class="summary" hidden></div>
      <div class="overview-chart-controls"><label for="overview-period">Período do gráfico <select id="overview-period"><option value="all">Todo o histórico</option><option value="365">365 dias</option><option value="90">90 dias</option><option value="30">30 dias</option></select></label></div>
      <section id="systems-trend-panel" class="dashboard-panel systems-trend-panel" hidden>
        <div class="panel-heading"><div><h2>Tendência histórica por sistema</h2><p>Uma linha para cada sistema, no período selecionado</p></div></div>
        <svg id="systems-trend-chart" viewBox="0 0 720 230" role="img" aria-label="Taxa de aprovação histórica de cada sistema"></svg>
        <div id="systems-trend-labels" class="trend-labels"></div>
        <div id="systems-trend-legend" class="systems-trend-legend"></div>
      </section>
      <ul id="systems" class="systems"></ul>
    </section>
    <section id="report-section" class="report-section" hidden>
      <p id="report-status" role="status" hidden></p>
      <iframe id="report" title="Relatório detalhado do sistema" sandbox="allow-scripts allow-downloads allow-popups"></iframe>
    </section>

    <div id="pdf-modal" class="modal-backdrop" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
        <div class="modal-header">
          <h2 id="pdf-modal-title">Gerar Relatório em PDF</h2>
          <button id="close-pdf-modal" type="button" class="btn-close" aria-label="Fechar">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <label for="pdf-title">Título do relatório</label>
            <input type="text" id="pdf-title" value="Relatório de Testes Automatizados">
          </div>
          <div class="modal-field">
            <div class="field-header">
              <span class="field-label">Sistemas a incluir</span>
              <div class="field-actions">
                <button type="button" id="pdf-all-systems" class="btn-link">Selecionar todos</button>
                <button type="button" id="pdf-none-systems" class="btn-link">Limpar</button>
              </div>
            </div>
            <div id="pdf-systems-container" class="checkbox-list"></div>
          </div>
          <div class="modal-field">
            <div class="field-header">
              <span class="field-label">Informações a incluir</span>
              <div class="field-actions">
                <button type="button" id="pdf-all-sections" class="btn-link">Selecionar todas</button>
                <button type="button" id="pdf-none-sections" class="btn-link">Limpar</button>
              </div>
            </div>
            <div class="checkbox-list">
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="executive" checked> <span><strong>Visão Executiva</strong> — Cards de cenários, aprovação e duração</span></label>
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="distribution" checked> <span><strong>Distribuição Visual</strong> — Barra gráfica e proporção dos resultados</span></label>
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="suites" checked> <span><strong>Resumo por Suíte</strong> — Tabela detalhada de status por módulo</span></label>
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="failures" checked> <span><strong>Detalhamento de Falhas</strong> — Listagem de testes que falharam com erro</span></label>
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="history" checked> <span><strong>Histórico Recente</strong> — Tabela das últimas execuções</span></label>
              <label class="checkbox-item"><input type="checkbox" name="pdf_sec" value="slowest" checked> <span><strong>Testes Mais Lentos</strong> — Top 10 cenários de maior tempo</span></label>
            </div>
          </div>
          <p id="pdf-status" class="modal-status" role="status" hidden></p>
        </div>
        <div class="modal-footer">
          <button id="cancel-pdf-modal" type="button" class="btn-secondary">Cancelar</button>
          <button id="submit-pdf-modal" type="button" class="btn-primary">Baixar PDF</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
